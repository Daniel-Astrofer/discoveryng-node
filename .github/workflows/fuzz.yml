name: Protocol fuzzing

on:
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/kerosene-discovery/**"
      - "crates/kerosene-membership/**"
      - "Cargo.toml"
      - "Cargo.lock"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fuzz-targets:
    name: Build fuzz targets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-07-30 --profile minimal
          cargo +nightly-2026-07-30 install cargo-fuzz --version 0.13.2 --locked
      - name: Compile PeerHello and AdmissionRequest fuzzers
        working-directory: fuzz
        run: cargo +nightly-2026-07-30 fuzz build
